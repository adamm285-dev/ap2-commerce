name: FieldSmith Pro CI

on:
  push:
    branches: [main, master, a2a-commerce]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend Test Suite (FastAPI + Pytest)
    runs-on: ubuntu-latest
    env:
      A2A_MANDATE_SECRET: "ci_test_mandate_secret_key_32_chars_long"
      ADMIN_API_KEY: "ci_admin_secret_token_key_for_testing"
      MOCK_EXTERNAL_APIS: "true"
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyyaml

      - name: Validate OpenAPI 3.1.0 Contract
        run: |
          python -c "import yaml; yaml.safe_load(open('openapi.yaml')); print('OpenAPI 3.1.0 specification is valid!')"

      - name: Run Pytest Suite
        run: |
          pytest backend/tests/ -v

      - name: Run Autonomous Buyer Agent CLI Simulation
        run: |
          python -m backend.agents.buyer_agent --budget 100 --trade flooring-tile

  frontend-build:
    name: Frontend Build & Typecheck (Vite + React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Compile & Vite Production Build
        run: npm run build
